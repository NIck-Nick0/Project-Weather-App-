<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Weather App</h1>
    </header>

    <!-- نموذج البحث -->
    <form id="search-form">
      <input 
        type="text" 
        id="location-input" 
        placeholder="Enter city (e.g. London, Cairo)..." 
        required 
      />
      <button type="submit">Search</button>
    </form>

    <!-- مؤشر التحميل (Loading Spinner) -->
    <div id="loading" class="loading hidden">Loading weather data...</div>

    <!-- بطاقة عرض بيانات الطقس -->
    <div id="weather-display" class="weather-card hidden">
      <h2 id="city-name">--</h2>
      <p id="condition">--</p>
      
      <div class="temp-container">
        <span id="temp-value">--</span>
        <button id="unit-toggle" data-unit="C">°C</button>
      </div>

      <div class="details">
        <p>Humidity: <span id="humidity">--</span>%</p>
        <p>High: <span id="temp-max">--</span></p>
        <p>Low: <span id="temp-min">--</span></p>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
